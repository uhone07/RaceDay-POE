name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs folder and required files
        run: |
          test -d docs
          test -f docs/RaceDay_Database.sql
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_ERD.png
          test -f README.md

  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RaceDay.Api/RaceDay.Api.slnx

      - name: Build
        run: dotnet build RaceDay.Api/RaceDay.Api.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.Api/RaceDay.Api.slnx --no-build --configuration Release --verbosity normal