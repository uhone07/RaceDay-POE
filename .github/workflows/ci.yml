name: Part 1 - Validate Docs Structure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          shopt -s nullglob
          files=(docs/*ERD*.png docs/*ERD*.pdf)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No ERD file (PNG or PDF) found in /docs."
            exit 1
          fi
          echo "ERD file found: ${files[0]}"

      - name: Check API endpoint plan exists (MD or PDF)
        run: |
          shopt -s nullglob
          files=(docs/*[Ee]ndpoint*.md docs/*[Ee]ndpoint*.pdf)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No API endpoint plan (MD or PDF) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found: ${files[0]}"

      - name: Check SQL script exists
        run: |
          shopt -s nullglob
          files=(docs/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found: ${files[0]}"

      - name: Check README.md exists at repo root
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid for Part 1 submission."
