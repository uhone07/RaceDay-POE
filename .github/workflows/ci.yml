name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs folder and required files
        run: |
          test -d docs
          test -f docs/RaceDay_Database.sql
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_ERD.png
          test -f README.md

  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RaceDay.Api/RaceDay.Api.slnx

      - name: Build API and tests
        run: dotnet build RaceDay.Api/RaceDay.Api.slnx --no-restore --configuration Release

      - name: Build MVC web application (RaceDay.Web)
        run: dotnet build RaceDay.Api/RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.Api/RaceDay.Api.slnx --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - name: Build the RaceDay.Web Docker image
        run: docker build -t raceday-web RaceDay.Api/RaceDay.Web

      - name: Run the container and check the home page responds
        run: |
          docker run -d --name raceday-web -p 8080:8080 raceday-web
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "RaceDay.Web container is running and the home page returned 200"
              exit 0
            fi
            sleep 2
          done
          docker logs raceday-web
          exit 1
